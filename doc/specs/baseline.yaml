version: 1

repository:
  default_base_branch: main
  package_manager: npm
  project_instruction_file: AGENTS.md
  package_manifest: package.json
  ci_workflow_dir: TODO_CONFIRM:no_.github_workflows_directory_found

sources:
  authoritative_prd: doc/specs/MVP_PRD_v1.0.9-authoritative.md
  authoritative_schema: src/main/db/schema.sql
  authoritative_architecture: doc/specs/architecture-plan-b-multi-device-v2.2-authoritative-baseline.md
  workflow_contract: doc/ai/vibe-workflow-contract.md
  project_invariants: doc/specs/project-invariants.md
  json_contract:
    runtime_type_source: src/shared/types/json-schemas.ts
    readable_reference: doc/specs/xc-career-guide-json-field-schema-v1.0.0.md
  event_contract:
    runtime_type_source: src/shared/types/event-payloads.ts
    readable_reference: doc/specs/xc-career-guide-event-payload-schema-v1.0.0.md
  ipc_contract:
    shared_type_source: src/shared/types/ipc-api.ts
    preload_whitelist: src/preload/index.ts
  job_skill_preview_contract_impl_plan: doc/features/job-skill-298-full-preview-persistence-contract-impl.md
  job_skill_preview_contract_impl_review: doc/features/job-skill-298-full-preview-persistence-contract-impl-r3-review.md
  job_skill_preview_contract_impl_acceptance: doc/features/job-skill-298-full-preview-persistence-contract-impl-acceptance.md
  job_skill_preview_contract_impl_code_review: doc/features/job-skill-298-full-preview-persistence-contract-impl-code-review-r3.md
  school_demo_activation_prd: doc/features/school-demo-first-online-activation-prd.md
  school_demo_activation_prd_review: doc/features/school-demo-first-online-activation-prd-review.md
  school_demo_activation_impl_plan: doc/features/school-demo-first-online-activation-impl.md
  doc_index: doc/index.md

commands:
  typecheck: npm run typecheck
  lint: npm run lint
  unit_test: npm test
  build: npm run build
  schema_verify: npm run db:verify
  docs_index_update: npm run docs:index:update
  docs_index_check: npm run docs:index:check
  asset_manifest_validate: npm run asset:validate
  job_skill_contract_check: npm run contract:job-skill:check
  job_skill_delivery_check: npm run contract:job-skill:delivery:check
  base_ability_gate_check: npm run contract:base-ability:gate:check
  m4_safety_sql_check: npm run contract:m4:safety-sql:check
  m4_db_verify: npm run db:m4:verify
  m4_native_electron_verify: npm run db:m4:native:verify
  m5a_command_boundary_check: npm run contract:m5a:command-boundary:check
  m5a_contract_scope_check: npm run contract:m5a:scope:check -- --base 40541c82ef374f28ce300365e0e5cc82423dd99a
  m5a_isolated_db_verify: npm run db:m5a:isolated:verify
  preview_contract_parity: npm run contract:preview:parity -- --db <explicit-absolute-isolated-db-path>

risk_triggers:
  R3:
    - schema
    - migration
    - safety_incident
    - REDLINE_HALTED
    - FSM
    - state_machine
    - permission_model
    - data_repair
    - irreversible_operation
    - core_result_calculation
    - multi_device_assignment
  R2:
    - ipc
    - api
    - event_type
    - result_projection
    - report_generation
    - persistent_write
    - strategy_config
    - renderer_route

manual_acceptance:
  - teacher_core_flow
  - student_core_flow
  - safety_redline_flow
  - electron_desktop_smoke
  - multi_device_assignment_flow

notes:
  - 2026-08-02 产品负责人确认“学校演示和业务闭环优先”：预览版与正式版共用同一应用，使用可配置地址的普通在线激活；教师/管理员可直接浏览 298 道 JOB_SKILL 题，当前固定 18+6 负责跑通测评到报告。PREVIEW_CONTRACT_V1 的自定义信任锚、签名、principal 和 registry promotion 保留为历史兼容/实验能力，但不再是题库目录或主业务演示的前置门。详细合同见 doc/features/school-demo-first-online-activation-prd.md。该 R3 产品方向已经用户批准；独立 Reviewer 服务不可用，当前技术复核为 CONDITIONAL_PASS_NON_INDEPENDENT，不得宣称独立 PASS。
  - authoritative_prd 路径为兼容既有引用保留 MVP_PRD_v1.0.9-authoritative.md 文件名，但正文当前权威版本为 PRD v1.0.10-job-skill-298-full-preview。后续会话必须按“298 题全量入预览库、教师全库可见、素材 AI 并行生产、逐题包开放”理解 JOB_SKILL 当前范围；固定 18+6 仅为正式计分路径。该产品范围已经确认，对应产品 Mini-PRD 已通过独立 R3 闭合复核（PASS），状态为 APPROVED；独立持久化/权限数据合同 Mini-PRD 也已通过最终独立 R3 复审（PASS，P0/P1=0，P2=2）。其实现计划已完成 Step 0–10 自动化闭合，当前状态为 `AUTOMATION_PASS_MANUAL_PENDING`；原产品计划仍不等同于已交付题库、素材或 UI。
  - 当前工程 Schema 基线为 v0.1.19-job-skill-preview-contract-v1，前置 M5B 基线为 v0.1.18-event-batch-v2.2。M5B-15、预览 migration、principal、preview session/safety、feedback vault/reference、17 通道 IPC 和 readiness verifier 的自动化证据已通过；fresh/current isolated DB 的 `preview_contract_registry` 仍为 INSTALLING，未执行默认库 promotion。M4 Step 2A 与 M5A Step 2B 已 ACCEPTED；M5B-15 见 doc/features/event-batch-v2.2-runtime-m5b15-r3-review.md。BASE_ABILITY 与既有用户改动保持原样。
  - AGENTS.md 的工程基线摘要已同步为 v0.1.19-job-skill-preview-contract-v1（前置 M5B-15 PASS）。当前权威 Schema 声明仍以本文件与 src/main/db/schema.sql 为准；实现级自动化验收和人工未完成项分别见 `doc/features/job-skill-298-full-preview-persistence-contract-impl-acceptance.md` 与 `doc/features/job-skill-298-full-preview-persistence-contract-impl-code-review-r3.md`。
  - MVP_PRD_v1.0.9-authoritative.md（正文 v1.0.10）declares src/main/db/schema.sql as the database DDL source of truth.
  - MVP_PRD_v1.0.9-authoritative.md（正文 v1.0.10）declares src/shared/types/json-schemas.ts and src/shared/types/event-payloads.ts as runtime JSON and event type sources; the Markdown specs remain readable historical references.
  - No CI workflow directory was found in this checkout during installation.
