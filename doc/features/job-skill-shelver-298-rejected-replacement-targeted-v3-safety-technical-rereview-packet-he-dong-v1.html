<script>(()=>{const pkg=JSON.parse(document.getElementById('package-data').textContent);const fields=[["safety_conclusion","安全结论",["PASS","RETURN_FOR_REVISION"]],["technical_conclusion","技术结论",["PASS","RETURN_FOR_REVISION"]],["renderer_feasibility","渲染与现场可执行性",["PASS","RETURN_FOR_REVISION"]],["data_contract_integrity","数据合同完整性",["PASS","RETURN_FOR_REVISION"]],["safety_sensitive_decision","安全敏感标记",["KEEP","ADD","REMOVE"]]];const key='svets-review:'+pkg.package_id;const saved=JSON.parse(localStorage.getItem(key)||'{}');const cards=document.getElementById('cards');const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const select=(qid,name,label,values)=>'<label>'+esc(label)+'</label><select data-qid="'+esc(qid)+'" data-field="'+esc(name)+'" required><option value="">请选择</option>'+values.map(v=>'<option value="'+v+'">'+v+'</option>').join('')+'</select>';for(const q of pkg.questions){const p=q.structured_replacement_plan;const div=document.createElement('article');div.className='card';div.innerHTML='<h2>'+esc(q.question_id)+'</h2><p class="muted">上一版 '+esc(q.previous_question_id)+' · 激活权 NONE</p><div class="grid"><div class="block full"><b>上轮退回点</b>\n'+esc(q.prior_review_issue)+'</div><div class="block full"><b>V3定点修改字段</b>\n'+esc(q.changed_fields.join('、'))+'</div><div class="block full"><b>题干</b>\n'+esc(p.prompt)+'</div><div class="block full"><b>现场材料</b>\n'+esc(p.materials)+'</div><div class="block"><b>唯一结果</b>\n'+esc(p.unique_outcome)+'</div><div class="block"><b>边界</b>\n'+esc(p.boundary_label+'：'+p.boundary)+'</div><div class="block full"><b>评分</b>\n2分：'+esc(p.scoring_thresholds.score_2)+'\n1分：'+esc(p.scoring_thresholds.score_1)+'\n0分：'+esc(p.scoring_thresholds.score_0)+'</div></div>'+fields.map(f=>select(q.question_id,f[0],f[1],f[2])).join('')+'<label>停止条件说明</label><textarea data-qid="'+esc(q.question_id)+'" data-field="stop_condition_note" required></textarea><label>技术复审说明</label><textarea data-qid="'+esc(q.question_id)+'" data-field="technical_note" required></textarea>';cards.appendChild(div)}for(const el of document.querySelectorAll('[data-qid]')){const v=saved[el.dataset.qid]?.[el.dataset.field];if(v)el.value=v;el.addEventListener('input',save);el.addEventListener('change',save)}function collect(){const out={};for(const el of document.querySelectorAll('[data-qid]')){(out[el.dataset.qid]??={})[el.dataset.field]=el.value.trim()}return out}function save(){localStorage.setItem(key,JSON.stringify(collect()));document.getElementById('status').textContent='已自动保存'}document.getElementById('export').addEventListener('click',()=>{const values=collect();for(const q of pkg.questions){for(const [name] of fields){if(!values[q.question_id]?.[name])return alert(q.question_id+' 尚未填写 '+name)}const notes=['stop_condition_note','technical_note'];for(const name of notes){if(!values[q.question_id]?.[name])return alert(q.question_id+' 尚未填写 '+name)}}const questions=pkg.questions.map(q=>{const review_fields=values[q.question_id];const failed=['safety_conclusion','technical_conclusion','renderer_feasibility','data_contract_integrity'].some(name=>review_fields[name]==='RETURN_FOR_REVISION');return{question_id:q.question_id,previous_question_id:q.previous_question_id,new_semantic_hash:q.new_semantic_hash,candidate_record_hash:q.candidate_record_hash,activation_authority:'NONE',conclusion:failed?'RETURN_FOR_REVISION':'PASS',review_fields}});const pass=questions.filter(q=>q.conclusion==='PASS').length;const result={schema_version:pkg.result_schema_version,package_id:pkg.package_id,candidate_set_id:pkg.source.candidate_set_id,candidate_set_hash:pkg.source.candidate_set_hash,reviewer:pkg.reviewer,submitted_at:new Date().toISOString(),summary:{total:questions.length,pass,return_for_revision:questions.length-pass},authority:{activation_authority_granted:false,can_activate_questions:false,runtime_database_change_allowed:false,activation_sql_generated:false},questions};const blob=new Blob([JSON.stringify(result,null,2)+'\n'],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=pkg.package_id+'-result.json';a.click();URL.revokeObjectURL(a.href);document.getElementById('status').textContent='已导出JSON；未授予激活权'})})();</script></body></html>\n
