:[],"renderer_gap":"question prompt, tools and rubric anchors are not rendered"}]}</script>
<script>
(function () {
  "use strict";

  var packageData = JSON.parse(document.getElementById("package-data").textContent);
  var storageKey = "svets-review:" + packageData.package_id + ":manifest-" + packageData.manifest_version;
  var state = { reviewed_date: "", reviews: {}, submission: null };
  var currentIndex = 0;
  var activeFilter = "all";
  var searchTerm = "";
  var saveTimer = null;

  var elements = {
    nav: document.getElementById("question-nav"),
    content: document.getElementById("question-content"),
    reviewedDate: document.getElementById("reviewed-date"),
    search: document.getElementById("question-search"),
    saveState: document.getElementById("save-state"),
    progressLabel: document.getElementById("progress-label"),
    progressPercent: document.getElementById("progress-percent"),
    progressValue: document.getElementById("progress-value"),
    previous: document.getElementById("previous-button"),
    next: document.getElementById("next-button"),
    submit: document.getElementById("submit-button"),
    errorSummary: document.getElementById("error-summary"),
    resultPanel: document.getElementById("result-panel"),
    resultCopy: document.getElementById("result-copy"),
    importFile: document.getElementById("import-file"),
    importButton: document.getElementById("import-button"),
    downloadJson: document.getElementById("download-json"),
    downloadMarkdown: document.getElementById("download-markdown")
  };

  function escapeHtml(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function getReview(questionId) {
    if (!state.reviews[questionId]) state.reviews[questionId] = {};
    return state.reviews[questionId];
  }

  function hasText(value) {
    return typeof value === "string" && value.trim().length > 0;
  }

  function saveState() {
    try {
      localStorage.setItem(storageKey, JSON.stringify(state));
      elements.saveState.textContent = "已自动保存 " + new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
      elements.saveState.style.color = "var(--success)";
    } catch (error) {
      elements.saveState.textContent = "浏览器无法自动保存，请提交后下载结果";
      elements.saveState.style.color = "var(--danger)";
    }
  }

  function scheduleSave() {
    clearTimeout(saveTimer);
    elements.saveState.textContent = "正在保存";
    saveTimer = setTimeout(saveState, 220);
  }

  function loadState() {
    try {
      var stored = localStorage.getItem(storageKey);
      if (stored) {
        var parsed = JSON.parse(stored);
        if (parsed && typeof parsed === "object") state = Object.assign(state, parsed);
      }
    } catch (error) {
      elements.saveState.textContent = "未能读取本机草稿";
      elements.saveState.style.color = "var(--danger)";
    }
    elements.reviewedDate.value = state.reviewed_date || "";
  }

  function radioGroup(field, label, options, selected) {
    var html = '<div class="field-block"><span class="field-label">' + escapeHtml(label) + ' <span class="required">*</span></span><div class="choice-grid">';
    options.forEach(function (option) {
      var id = field + "-" + option.value;
      html += '<label class="choice" for="' + escapeHtml(id) + '">';
      html += '<input id="' + escapeHtml(id) + '" type="radio" name="' + escapeHtml(field) + '" data-field="' + escapeHtml(field) + '" value="' + escapeHtml(option.value) + '"' + (selected === option.value ? " checked" : "") + '>';
      html += '<span class="choice-copy"><strong>' + escapeHtml(option.label) + '</strong>';
      if (option.help) html += '<span>' + escapeHtml(option.help) + '</span>';
      html += '</span></label>';
    });
    return html + "</div></div>";
  }

  function textareaField(field, label, value, placeholder, required) {
    return '<div class="field-block"><label class="field-label" for="' + escapeHtml(field) + '">' + escapeHtml(label) + (required ? ' <span class="required">*</span>' : "") + '</label>' +
      '<textarea id="' + escapeHtml(field) + '" data-field="' + escapeHtml(field) + '" placeholder="' + escapeHtml(placeholder || "") + '">' + escapeHtml(value || "") + '</textarea></div>';
  }

  function selectField(field, label, value, options) {
    var html = '<div class="field-block"><label class="field-label" for="' + escapeHtml(field) + '">' + escapeHtml(label) + ' <span class="required">*</span></label>';
    html += '<select class="select-input" id="' + escapeHtml(field) + '" data-field="' + escapeHtml(field) + '"><option value="">请选择</option>';
    options.forEach(function (option) {
      html += '<option value="' + escapeHtml(option) + '"' + (value === option ? " selected" : "") + '>' + escapeHtml(option) + '</option>';
    });
    return html + "</select></div>";
  }

  function renderSource(question) {
    var optionsHtml = "";
    if (question.options.length) {
      optionsHtml = '<ul class="option-list">' + question.options.map(function (option) {
        return '<li class="option"><span class="option-key">' + escapeHtml(option.key) + '</span><span>' + escapeHtml(option.text) + '</span></li>';
      }).join("") + "</ul>";
    }

    var offlineHtml = "";
    if (question.question_type === "OFFLINE_OPERATION") {
      offlineHtml = '<div class="source-details"><div><span class="eyebrow">工具和材料</span><strong>' + escapeHtml(question.tool_brief || "未填写") + '</strong></div>';
      offlineHtml += '<div><span class="eyebrow">当前评分锚点</span><strong>0 未能完成 · 1 部分完成 · 2 完全达标</strong></div></div>';
      offlineHtml += '<div class="field-block"><span class="field-label">当前可观察指标</span><ul class="criteria-list">' +
        question.rubric_criteria.map(function (criterion) { return "<li>" + escapeHtml(criterion.description) + "</li>"; }).join("") + "</ul></div>";
    } else {
      offlineHtml = '<div class="source-details"><div><span class="eyebrow">候选答案</span><strong>' + escapeHtml(question.candidate_answer) + '</strong></div>' +
        '<div><span class="eyebrow">素材状态</span><strong>' + escapeHtml(question.media_brief || "无素材说明") + "，已绑定 " + question.asset_ids.length + " 项</strong></div></div>";
    }

    return '<section class="source-card" aria-label="题目候选内容"><p class="source-prompt">' + escapeHtml(question.prompt) + '</p>' + optionsHtml + offlineHtml + "</section>";
  }

  function renderOnlineForm(question, review) {
    var html = '<form class="review-form" novalidate>';
    html += '<section class="form-section"><h3>题目质量</h3><p class="help">确认题干是否清楚，选项是否只有一个最佳答案。</p>';
    html += radioGroup("prompt_review", "题干", [
      { value: "PASS", label: "通过", help: "表述清楚，可以直接施测" },
      { value: "RETURN", label: "退回修改", help: "存在歧义、错字或职业口径问题" }
    ], review.prompt_review);
    html += radioGroup("options_review", "选项", [
      { value: "UNIQUE_BEST", label: "只有一个最佳答案", help: "三个选项互斥" },
      { value: "AMBIGUOUS", label: "存在歧义", help: "可能有多个可接受答案" }
    ], review.options_review);
    html += "</section>";

    html += '<section class="form-section"><h3>答案确认</h3><p class="help">当前候选答案为 ' + escapeHtml(question.candidate_answer) + "。</p>";
    html += radioGroup("answer_review", "答案结论", [
      { value: "CONFIRMED", label: "确认候选答案", help: "答案为 " + question.candidate_answer },
      { value: "CHANGED", label: "需要改答案", help: "填写新的答案" },
      { value: "UNABLE", label: "无法确认", help: "需要补充专业依据" }
    ], review.answer_review);
    if (review.answer_review === "CHANGED") {
      html += selectField("reviewed_answer", "建议答案", review.reviewed_answer, ["A", "B", "C"]);
    }
    html += textareaField("review_basis", "审核依据", review.review_basis, "填写职业规范、门店作业规则或培训口径", true);
    html += "</section>";

    html += '<section class="form-section"><h3>素材裁决</h3><p class="help">判断没有图片时是否仍能准确理解和作答。</p>';
    html += radioGroup("material_decision", "素材结论", [
      { value: "TEXT_ONLY_APPROVED", label: "允许纯文本施测", help: "不依赖图片也能准确作答" },
      { value: "ASSET_REQUIRED", label: "必须补素材", help: "缺少素材会影响理解或区分" }
    ], review.material_decision);
    if (review.material_decision === "ASSET_REQUIRED") {
      html += textareaField("material_requirement", "素材要求", review.material_requirement, "写清素材内容及其对作答的作用", true);
    }
    html += "</section>";

    html += '<section class="form-section"><h3>内容结论</h3><p class="help">答案、题干或素材需要变化时，当前候选题只能退回修改。</p>';
    html += radioGroup("content_conclusion", "逐题结论", [
      { value: "APPROVED", label: "内容通过", help: "当前候选内容可以继续技术和安全复核" },
      { value: "RETURN_FOR_REVISION", label: "退回修改", help: "修订后重新计算 hash 并复审" },
      { value: "REJECTED", label: "拒绝或换题", help: "建议在新的策略版本中替换" }
    ], review.content_conclusion);
    html += textareaField("review_note", "审核备注", review.review_note, "概括通过理由或需要修改的内容", true);
    html += "</section></form>";
    return html;
  }

  function renderOfflineForm(question, review) {
    var html = '<div class="notice danger">系统预检：当前 0、1、2 分锚点过于泛化，本题不能直接判定内容通过。请给出具体锚点后退回修订。</div>';
    html += '<form class="review-form" novalidate>';
    html += '<section class="form-section"><h3>可执行性</h3><p class="help">确认现场是否能按题干、工具和观察指标完成施测。</p>';
    html += radioGroup("task_executable", "任务可以执行", [
      { value: "YES", label: "是", help: "题干动作可以现场完成" },
      { value: "NO", label: "否", help: "任务条件或动作不成立" }
    ], review.task_executable);
    html += radioGroup("tools_complete", "工具和材料完整", [
      { value: "YES", label: "是", help: "现有清单足以准备施测" },
      { value: "NO", label: "否", help: "需要补充或更换材料" }
    ], review.tools_complete);
    html += radioGroup("criteria_sufficient", "观察指标足以评分", [
      { value: "YES", label: "是", help: "指标清楚且可以观察" },
      { value: "NO", label: "否", help: "指标遗漏或互相重叠" }
    ], review.criteria_sufficient);
    html += "</section>";

    html += '<section class="form-section"><h3>建议评分锚点</h3><p class="help">三档描述必须可观察、互斥，并能让不同评分人得到一致结论。</p><div class="anchor-grid">';
    html += '<div><span class="anchor-score">0 分</span><textarea data-field="anchor_0" placeholder="未达到哪些关键动作或出现什么失败">' + escapeHtml(review.anchor_0 || "") + "</textarea></div>";
    html += '<div><span class="anchor-score">1 分</span><textarea data-field="anchor_1" placeholder="完成了哪些部分，还缺少什么">' + escapeHtml(review.anchor_1 || "") + "</textarea></div>";
    html += '<div><span class="anchor-score">2 分</span><textarea data-field="anchor_2" placeholder="全部达到哪些可观察条件">' + escapeHtml(review.anchor_2 || "") + "</textarea></div></div>";
    html += textareaField("safety_note", question.safety_sensitive ? "停止条件或安全关注" : "停止条件或安全关注（没有可填“无”）", review.safety_note, "记录需要赫东复核的安全事项", question.safety_sensitive);
    html += "</section>";

    html += '<section class="form-section"><h3>内容结论</h3><p class="help">补充锚点会改变候选记录，本轮只能退回修订或拒绝。</p>';
    html += radioGroup("content_conclusion", "逐题结论", [
      { value: "RETURN_FOR_REVISION", label: "退回修改", help: "采用建议锚点形成修订候选" },
      { value: "REJECTED", label: "拒绝或换题", help: "任务不适合进入本次 Pilot" }
    ], review.content_conclusion);
    html += textareaField("review_note", "审核备注", review.review_note, "概括可执行性判断和需要修改的内容", true);
    html += "</section></form>";
    return html;
  }

  function renderQuestion() {
    var question = packageData.questions[currentIndex];
    var review = getReview(question.question_id);
    var flags = question.source_flags.map(function (flag) {
      return '<div class="notice danger source-flags">' + escapeHtml(flag) + "</div>";
    }).join("");

    var html = '<div class="question-head"><div class="question-number">' + String(currentIndex + 1).padStart(2, "0") + " / 24</div>";
    html += '<div class="question-title"><h2>' + escapeHtml(question.question_id + " · " + (question.question_type === "SINGLE_CHOICE" ? "线上单选" : "线下实操")) + '</h2>';
    html += '<div class="meta-line"><span class="badge">' + escapeHtml(question.module) + '</span><span class="badge">' + escapeHtml(question.target_construct) + '</span>';
    html += '<span class="badge">候选 hash ' + escapeHtml(question.candidate_record_hash.slice(7, 19)) + '</span>';
    if (question.safety_sensitive) html += '<span class="badge safety">安全敏感题</span>';
    html += "</div></div></div>";
    html += flags + renderSource(question);
    html += question.question_type === "SINGLE_CHOICE" ? renderOnlineForm(question, review) : renderOfflineForm(question, review);
    elements.content.innerHTML = html;
    bindReviewInputs();
    updateFooter();
    elements.errorSummary.classList.remove("visible");
    history.replaceState(null, "", "#" + question.question_id);
    document.title = question.question_id + " · Pilot 内容审核";
  }

  function bindReviewInputs() {
    elements.content.querySelectorAll("[data-field]").forEach(function (input) {
      input.addEventListener(input.type === "radio" || input.tagName === "SELECT" ? "change" : "input", function () {
        var question = packageData.questions[currentIndex];
        var review = getReview(question.question_id);
        review[input.dataset.field] = input.value;
        state.submission = null;
        elements.resultPanel.classList.remove("visible");
        scheduleSave();
        updateProgress();
        renderNav();
        if (input.dataset.field === "answer_review" || input.dataset.field === "material_decision") {
          renderQuestion();
          var conditional = document.querySelector('[data-field="' + (input.dataset.field === "answer_review" ? "reviewed_answer" : "material_requirement") + '"]');
          if (conditional) conditional.focus();
        }
      });
    });
  }

  function questionErrors(question, review) {
    var errors = [];
    function requireField(field, label) {
      if (!hasText(review[field])) errors.push({ field: field, label: label });
    }

    if (question.question_type === "SINGLE_CHOICE") {
      requireField("prompt_review", "题干结论");
      requireField("options_review", "选项结论");
      requireField("answer_review", "答案结论");
      if (review.answer_review === "CHANGED") requireField("reviewed_answer", "建议答案");
      requireField("review_basis", "审核依据");
      requireField("material_decision", "素材结论");
      if (review.material_decision === "ASSET_REQUIRED") requireField("material_requirement", "素材要求");
      requireField("content_conclusion", "内容结论");
      requireField("review_note", "审核备注");

      if (review.content_conclusion === "APPROVED") {
        if (review.prompt_review !== "PASS") errors.push({ field: "content_conclusion", label: "题干未通过时不能判定内容通过" });
        if (review.options_review !== "UNIQUE_BEST") errors.push({ field: "content_conclusion", label: "选项存在歧义时不能判定内容通过" });
        if (review.answer_review !== "CONFIRMED") errors.push({ field: "content_conclusion", label: "答案需要变化或无法确认时不能判定内容通过" });
        if (review.material_decision !== "TEXT_ONLY_APPROVED") errors.push({ field: "content_conclusion", label: "必须补素材时不能判定当前候选内容通过" });
      }
    } else {
      requireField("task_executable", "任务可执行性");
      requireField("tools_complete", "工具和材料");
      requireField("criteria_sufficient", "观察指标");
      requireField("anchor_0", "0 分锚点");
      requireField("anchor_1", "1 分锚点");
      requireField("anchor_2", "2 分锚点");
      if (question.safety_sensitive) requireField("safety_note", "停止条件或安全关注");
      requireField("content_conclusion", "内容结论");
      requireField("review_note", "审核备注");
    }
    return errors;
  }

  function reviewStatus(question) {
    var review = getReview(question.question_id);
    if (questionErrors(question, review).length === 0) return "complete";
    if (Object.keys(review).some(function (key) { return hasText(review[key]); })) return "partial";
    return "empty";
  }

  function matchesFilter(question) {
    var review = getReview(question.question_id);
    var status = reviewStatus(question);
    if (searchTerm) {
      var haystack = (question.question_id + " " + question.prompt).toLowerCase();
      if (haystack.indexOf(searchTerm) === -1) return false;
    }
    if (activeFilter === "incomplete") return status !== "complete";
    if (activeFilter === "approved") return review.content_conclusion === "APPROVED";
    if (activeFilter === "revision") return review.content_conclusion === "RETURN_FOR_REVISION" || review.content_conclusion === "REJECTED";
    if (activeFilter === "asset") return review.material_decision === "ASSET_REQUIRED";
    return true;
  }

  function renderNav() {
    elements.nav.innerHTML = packageData.questions.map(function (question, index) {
      if (!matchesFilter(question)) return "";
      var status = reviewStatus(question);
      var displayStatus = status === "empty" ? "empty" : status;
      return '<button type="button" class="nav-item' + (index === currentIndex ? " current" : "") + '" data-index="' + index + '" data-status="' + displayStatus + '">' +
        '<span class="nav-index">' + String(index + 1).padStart(2, "0") + '</span><span class="nav-copy"><span class="nav-id">' + escapeHtml(question.question_id) +
        '</span><span class="nav-prompt">' + escapeHtml(question.prompt) + '</span></span><span class="status-dot" aria-hidden="true"></span></button>';
    }).join("");

    elements.nav.querySelectorAll(".nav-item").forEach(function (button) {
      button.addEventListener("click", function () {
        currentIndex = Number(button.dataset.index);
        renderQuestion();
        renderNav();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
  }

  function updateProgress() {
    var complete = packageData.questions.filter(function (question) { return reviewStatus(question) === "complete"; }).length;
    var percent = Math.round(complete / packageData.questions.length * 100);
    elements.progressLabel.textContent = "已完成 " + complete + " / " + packageData.questions.length;
    elements.progressPercent.textContent = percent + "%";
    elements.progressValue.style.transform = "scaleX(" + (complete / packageData.questions.length) + ")";
  }

  function updateFooter() {
    elements.previous.disabled = currentIndex === 0;
    elements.next.disabled = currentIndex === packageData.questions.length - 1;
  }

  function navigate(delta) {
    var nextIndex = Math.min(packageData.questions.length - 1, Math.max(0, currentIndex + delta));
    if (nextIndex !== currentIndex) {
      currentIndex = nextIndex;
      renderQuestion();
      renderNav();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  }

  function buildResult() {
    var submittedAt = new Date().toISOString();
    var questionResults = packageData.questions.map(function (question) {
      var review = getReview(question.question_id);
      var base = {
        question_id: question.question_id,
        question_version: question.question_version,
        candidate_record_hash: question.candidate_record_hash,
        question_type: question.question_type,
        content_conclusion: review.content_conclusion,
        review_note: review.review_note.trim()
      };
      if (question.question_type === "SINGLE_CHOICE") {
        return Object.assign(base, {
          prompt_review: review.prompt_review,
          options_review: review.options_review,
          answer_review: review.answer_review,
          candidate_answer: question.candidate_answer,
          reviewed_answer: review.answer_review === "CHANGED" ? review.reviewed_answer : (review.answer_review === "CONFIRMED" ? question.candidate_answer : null),
          review_basis: review.review_basis.trim(),
          material_decision: review.material_decision,
          material_requirement: review.material_decision === "ASSET_REQUIRED" ? review.material_requirement.trim() : null
        });
      }
      return Object.assign(base, {
        task_executable: review.task_executable,
        tools_complete: review.tools_complete,
        criteria_sufficient: review.criteria_sufficient,
        proposed_anchors: {
          score_0: review.anchor_0.trim(),
          score_1: review.anchor_1.trim(),
          score_2: review.anchor_2.trim()
        },
        safety_note: (review.safety_note || "").trim()
      });
    });

    function count(field, value) {
      return questionResults.filter(function (question) { return question[field] === value; }).length;
    }

    return {
      schema_version: "job-skill-content-review-result-v1",
      result_id: "job-skill-review-" + state.reviewed_date + "-" + submittedAt.replace(/[^0-9]/g, "").slice(0, 14),
      status: "SUBMITTED",
      package: {
        package_id: packageData.package_id,
        package_version: packageData.package_version,
        manifest_id: packageData.manifest_id,
        manifest_version: packageData.manifest_version
      },
      strategy: {
        strategy_id: packageData.strategy_id,
        strategy_version: packageData.strategy_version
      },
      reviewer: {
        name: packageData.reviewer_name,
        role: "CONTENT_VOCATIONAL_REVIEWER",
        reviewed_date: state.reviewed_date,
        submitted_at: submittedAt
      },
      summary: {
        total: questionResults.length,
        online_total: questionResults.filter(function (question) { return question.question_type === "SINGLE_CHOICE"; }).length,
        offline_total: questionResults.filter(function (question) { return question.question_type === "OFFLINE_OPERATION"; }).length,
        approved: count("content_conclusion", "APPROVED"),
        return_for_revision: count("content_conclusion", "RETURN_FOR_REVISION"),
        rejected: count("content_conclusion", "REJECTED"),
        text_only_approved: count("material_decision", "TEXT_ONLY_APPROVED"),
        asset_required: count("material_decision", "ASSET_REQUIRED")
      },
      questions: questionResults
    };
  }

  function resultMarkdown(result) {
    var lines = [
      "# 超市理货员 Pilot 24 题内容审核结论",
      "",
      "- 审核人：" + result.reviewer.name,
      "- 审核日期：" + result.reviewer.reviewed_date,
      "- 提交时间：" + result.reviewer.submitted_at,
      "- 审核对象：" + result.strategy.strategy_id + "@" + result.strategy.strategy_version,
      "- 结果状态：" + result.status,
      "- 内容通过：" + result.summary.approved + " / 24",
      "- 退回修改：" + result.summary.return_for_revision + " / 24",
      "- 拒绝或换题：" + result.summary.rejected + " / 24",
      "- 允许纯文本：" + result.summary.text_only_approved + " / 18",
      "- 必须补素材：" + result.summary.asset_required + " / 18",
      "",
      "本结论只代表内容与职教审核，不授权修改题目状态、激活题目或修改 strategy v1。",
      ""
    ];

    result.questions.forEach(function (question, index) {
      lines.push("## " + String(index + 1).padStart(2, "0") + " " + question.question_id + "@1");
      lines.push("");
      lines.push("- 题型：" + question.question_type);
      lines.push("- 候选 hash：" + question.candidate_record_hash);
      lines.push("- 内容结论：" + question.content_conclusion);
      if (question.question_type === "SINGLE_CHOICE") {
        lines.push("- 题干：" + question.prompt_review);
        lines.push("- 选项：" + question.options_review);
        lines.push("- 答案：" + question.answer_review + "，候选 " + question.candidate_answer + "，审核后 " + (question.reviewed_answer || "无"));
        lines.push("- 审核依据：" + question.review_basis);
        lines.push("- 素材：" + question.material_decision);
        if (question.material_requirement) lines.push("- 素材要求：" + question.material_requirement);
      } else {
        lines.push("- 任务可执行：" + question.task_executable);
        lines.push("- 工具完整：" + question.tools_complete);
        lines.push("- 指标充分：" + question.criteria_sufficient);
        lines.push("- 0 分锚点：" + question.proposed_anchors.score_0);
        lines.push("- 1 分锚点：" + question.proposed_anchors.score_1);
        lines.push("- 2 分锚点：" + question.proposed_anchors.score_2);
        lines.push("- 安全关注：" + (question.safety_note || "无"));
      }
      lines.push("- 审核备注：" + question.review_note);
      lines.push("");
    });
    return lines.join("\n");
  }

  function downloadBlob(filename, type, content) {
    var url = URL.createObjectURL(new Blob([content], { type: type }));
    var link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function showSubmission(result) {
    state.submission = result;
    saveState();
    elements.resultCopy.textContent = "JSON 已下载，Markdown 结论已准备。内容通过 " + result.summary.approved + " 题，退回修改 " + result.summary.return_for_revision + " 题，拒绝或换题 " + result.summary.rejected + " 题。";
    elements.resultPanel.classList.add("visible");
    elements.resultPanel.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  function submitReview() {
    elements.errorSummary.classList.remove("visible");
    var globalErrors = [];
    if (!hasText(state.reviewed_date)) globalErrors.push("请填写审核日期。");

    var firstInvalid = null;
    packageData.questions.forEach(function (question, index) {
      var errors = questionErrors(question, getReview(question.question_id));
      if (errors.length && !firstInvalid) firstInvalid = { index: index, errors: errors };
    });

    if (globalErrors.length || firstInvalid) {
      if (firstInvalid) {
        currentIndex = firstInvalid.index;
        activeFilter = "incomplete";
        document.querySelectorAll(".filter-btn").forEach(function (button) {
          button.classList.toggle("active", button.dataset.filter === activeFilter);
        });
        renderQuestion();
        renderNav();
        var labels = firstInvalid.errors.map(function (error) { return error.label; });
        var dateMessage = globalErrors.length ? globalErrors.join(" ") + " " : "";
        elements.errorSummary.textContent = dateMessage + packageData.questions[firstInvalid.index].question_id + " 还有未完成或互相冲突的项目：" + labels.join("、") + "。";
        elements.errorSummary.classList.add("visible");
        setTimeout(function () {
          var target = document.querySelector('[data-field="' + firstInvalid.errors[0].field + '"]');
          if (target) target.focus();
        }, 0);
      } else {
        elements.errorSummary.textContent = globalErrors.join(" ");
        elements.errorSummary.classList.add("visible");
        elements.reviewedDate.focus();
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }

    var result = buildResult();
    showSubmission(result);
    downloadBlob(result.result_id + ".json", "application/json;charset=utf-8", JSON.stringify(result, null, 2) + "\n");
  }

  function importResult(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var result = JSON.parse(reader.result);
        if (result.schema_version !== "job-skill-content-review-result-v1") throw new Error("审核结果格式不匹配");
        if (!result.package || result.package.package_id !== packageData.package_id || result.package.manifest_version !== packageData.manifest_version) {
          throw new Error("审核包或 manifest 版本不匹配");
        }
        if (!Array.isArray(result.questions) || result.questions.length !== packageData.questions.length) throw new Error("题目数量不是 24");
        result.questions.forEach(function (item) {
          var question = packageData.questions.find(function (candidate) { return candidate.question_id === item.question_id; });
          if (!question || question.candidate_record_hash !== item.candidate_record_hash) throw new Error(item.question_id + " 的候选 hash 不匹配");
        });
        if (!window.confirm("导入会覆盖本机当前草稿，是否继续？")) return;

        state.reviewed_date = result.reviewer.reviewed_date;
        state.reviews = {};
        result.questions.forEach(function (item) {
          if (item.question_type === "SINGLE_CHOICE") {
            state.reviews[item.question_id] = {
              prompt_review: item.prompt_review,
              options_review: item.options_review,
              answer_review: item.answer_review,
              reviewed_answer: item.answer_review === "CHANGED" ? item.reviewed_answer : "",
              review_basis: item.review_basis,
              material_decision: item.material_decision,
              material_requirement: item.material_requirement || "",
              content_conclusion: item.content_conclusion,
              review_note: item.review_note
            };
          } else {
            state.reviews[item.question_id] = {
              task_executable: item.task_executable,
              tools_complete: item.tools_complete,
              criteria_sufficient: item.criteria_sufficient,
              anchor_0: item.proposed_anchors.score_0,
              anchor_1: item.proposed_anchors.score_1,
              anchor_2: item.proposed_anchors.score_2,
              safety_note: item.safety_note || "",
              content_conclusion: item.content_conclusion,
              review_note: item.review_note
            };
          }
        });
        state.submission = result;
        elements.reviewedDate.value = state.reviewed_date;
        saveState();
        renderQuestion();
        renderNav();
        updateProgress();
        showSubmission(result);
      } catch (error) {
        elements.errorSummary.textContent = "无法导入：" + error.message;
        elements.errorSummary.classList.add("visible");
        window.scrollTo({ top: 0, behavior: "smooth" });
      } finally {
        elements.importFile.value = "";
      }
    };
    reader.readAsText(file, "utf-8");
  }

  elements.reviewedDate.addEventListener("change", function () {
    state.reviewed_date = elements.reviewedDate.value;
    state.submission = null;
    elements.resultPanel.classList.remove("visible");
    scheduleSave();
  });
  elements.search.addEventListener("input", function () {
    searchTerm = elements.search.value.trim().toLowerCase();
    renderNav();
  });
  document.querySelectorAll(".filter-btn").forEach(function (button) {
    button.addEventListener("click", function () {
      activeFilter = button.dataset.filter;
      document.querySelectorAll(".filter-btn").forEach(function (item) { item.classList.toggle("active", item === button); });
      renderNav();
    });
  });
  elements.previous.addEventListener("click", function () { navigate(-1); });
  elements.next.addEventListener("click", function () { navigate(1); });
  elements.submit.addEventListener("click", submitReview);
  elements.importFile.addEventListener("change", function () {
    if (elements.importFile.files && elements.importFile.files[0]) importResult(elements.importFile.files[0]);
  });
  elements.importButton.addEventListener("click", function () { elements.importFile.click(); });
  elements.downloadJson.addEventListener("click", function () {
    if (!state.submission) return;
    downloadBlob(state.submission.result_id + ".json", "application/json;charset=utf-8", JSON.stringify(state.submission, null, 2) + "\n");
  });
  elements.downloadMarkdown.addEventListener("click", function () {
    if (!state.submission) return;
    downloadBlob(state.submission.result_id + ".md", "text/markdown;charset=utf-8", resultMarkdown(state.submission) + "\n");
  });

  var hashId = location.hash.slice(1);
  var hashIndex = packageData.questions.findIndex(function (question) { return question.question_id === hashId; });
  if (hashIndex >= 0) currentIndex = hashIndex;

  loadState();
  renderQuestion();
  renderNav();
  updateProgress();
  if (state.submission) {
    elements.resultPanel.classList.add("visible");
    elements.resultCopy.textContent = "已载入上次提交结果，可再次下载 JSON 或 Markdown。";
  }
})();
</script>
</body>
</html>
