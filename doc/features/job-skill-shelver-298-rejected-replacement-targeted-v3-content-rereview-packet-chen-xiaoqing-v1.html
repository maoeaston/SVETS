"'+esc(q.question_id)+'" data-field="required_revision" required></textarea>';cards.appendChild(div)}for(const el of document.querySelectorAll('[data-qid]')){const v=saved[el.dataset.qid]?.[el.dataset.field];if(v)el.value=v;el.addEventListener('input',save);el.addEventListener('change',save)}function collect(){const out={};for(const el of document.querySelectorAll('[data-qid]')){(out[el.dataset.qid]??={})[el.dataset.field]=el.value.trim()}return out}function save(){localStorage.setItem(key,JSON.stringify(collect()));document.getElementById('status').textContent='已自动保存'}document.getElementById('export').addEventListener('click',()=>{const values=collect();for(const q of pkg.questions){for(const [name] of fields){if(!values[q.question_id]?.[name])return alert(q.question_id+' 尚未填写 '+name)}const notes=['content_note','required_revision'];for(const name of notes){if(!values[q.question_id]?.[name])return alert(q.question_id+' 尚未填写 '+name)}}const questions=pkg.questions.map(q=>{const review_fields=values[q.question_id];const failed=['content_conclusion','occupational_authenticity','prompt_and_boundary','rubric_observability','material_feasibility'].some(name=>review_fields[name]==='RETURN_FOR_REVISION');return{question_id:q.question_id,previous_question_id:q.previous_question_id,new_semantic_hash:q.new_semantic_hash,candidate_record_hash:q.candidate_record_hash,activation_authority:'NONE',conclusion:failed?'RETURN_FOR_REVISION':'PASS',review_fields}});const pass=questions.filter(q=>q.conclusion==='PASS').length;const result={schema_version:pkg.result_schema_version,package_id:pkg.package_id,candidate_set_id:pkg.source.candidate_set_id,candidate_set_hash:pkg.source.candidate_set_hash,reviewer:pkg.reviewer,submitted_at:new Date().toISOString(),summary:{total:questions.length,pass,return_for_revision:questions.length-pass},authority:{activation_authority_granted:false,can_activate_questions:false,runtime_database_change_allowed:false,activation_sql_generated:false},questions};const blob=new Blob([JSON.stringify(result,null,2)+'\n'],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=pkg.package_id+'-result.json';a.click();URL.revokeObjectURL(a.href);document.getElementById('status').textContent='已导出JSON；未授予激活权'})})();</script></body></html>\n
